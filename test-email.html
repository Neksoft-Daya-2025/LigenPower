<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Functionality Test - Ligen Power®</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f6;
        }
        .test-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1a1a1a;
            margin-bottom: 30px;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .test-section h2 {
            color: #4CAF50;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .status {
            padding: 10px 15px;
            border-radius: 6px;
            margin: 10px 0;
            font-weight: 600;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        button {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76,175,80,0.3);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        pre {
            background: #1a1a1a;
            color: #00ff00;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>📧 Email Functionality Test</h1>
        
        <div class="test-section">
            <h2>1. Check SMTP Configuration</h2>
            <button onclick="checkSMTPConfig()">Check SMTP Config</button>
            <div id="smtp-status"></div>
        </div>
        
        <div class="test-section">
            <h2>2. Test Email Sending</h2>
            <input type="email" id="test-email" placeholder="Enter test email address" style="width: 300px; padding: 10px; margin: 10px 0; border: 2px solid #e5e5e5; border-radius: 6px;">
            <br>
            <button onclick="testEmail()">Send Test Email</button>
            <div id="email-status"></div>
        </div>
        
        <div class="test-section">
            <h2>3. Test Quote Request Form</h2>
            <button onclick="testQuoteForm()">Test Quote Request</button>
            <div id="quote-status"></div>
        </div>
        
        <div class="test-section">
            <h2>4. API Endpoints Status</h2>
            <button onclick="checkAPIEndpoints()">Check All APIs</button>
            <div id="api-status"></div>
        </div>
    </div>

    <script>
        async function checkSMTPConfig() {
            const statusDiv = document.getElementById('smtp-status');
            statusDiv.innerHTML = '<div class="status info">Checking...</div>';
            
            try {
                // Check localStorage
                const localConfig = localStorage.getItem('smtp_config');
                if (localConfig) {
                    const config = JSON.parse(localConfig);
                    statusDiv.innerHTML += `<div class="status success">✓ SMTP Config found in localStorage</div>`;
                    statusDiv.innerHTML += `<pre>${JSON.stringify(config, null, 2)}</pre>`;
                } else {
                    statusDiv.innerHTML += `<div class="status info">No SMTP config in localStorage</div>`;
                }
                
                // Check backend API
                const response = await fetch('api/get-smtp-config.php');
                const data = await response.json();
                
                if (data.success && data.config) {
                    statusDiv.innerHTML += `<div class="status success">✓ SMTP Config found in backend</div>`;
                    statusDiv.innerHTML += `<pre>${JSON.stringify(data.config, null, 2)}</pre>`;
                } else {
                    statusDiv.innerHTML += `<div class="status error">✗ SMTP Config not found in backend: ${data.message || 'Unknown error'}</div>`;
                }
            } catch (error) {
                statusDiv.innerHTML += `<div class="status error">✗ Error checking SMTP config: ${error.message}</div>`;
            }
        }
        
        async function testEmail() {
            const email = document.getElementById('test-email').value;
            const statusDiv = document.getElementById('email-status');
            
            if (!email) {
                statusDiv.innerHTML = '<div class="status error">Please enter an email address</div>';
                return;
            }
            
            statusDiv.innerHTML = '<div class="status info">Sending test email...</div>';
            
            try {
                // Load SMTP config
                let smtpConfig = null;
                const localConfig = localStorage.getItem('smtp_config');
                if (localConfig) {
                    smtpConfig = JSON.parse(localConfig);
                } else {
                    const configResponse = await fetch('api/get-smtp-config.php');
                    const configData = await configResponse.json();
                    if (configData.success && configData.config) {
                        smtpConfig = configData.config;
                    }
                }
                
                if (!smtpConfig) {
                    statusDiv.innerHTML = '<div class="status error">✗ SMTP not configured. Please configure it in the dashboard first.</div>';
                    return;
                }
                
                const recipientEmail = smtpConfig.recipientEmail || smtpConfig.fromEmail || email;
                
                const response = await fetch('api/send-email.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        to: recipientEmail,
                        subject: 'Test Email from Ligen Power®',
                        message: `
                            <h2>Test Email</h2>
                            <p>This is a test email sent from the Ligen Power® website.</p>
                            <p><strong>Sent to:</strong> ${email}</p>
                            <p><strong>Time:</strong> ${new Date().toLocaleString()}</p>
                            <hr>
                            <p><small>If you received this email, the SMTP configuration is working correctly!</small></p>
                        `,
                        config: smtpConfig
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    statusDiv.innerHTML = `<div class="status success">✓ Test email sent successfully to ${recipientEmail}!</div>`;
                } else {
                    statusDiv.innerHTML = `<div class="status error">✗ Failed to send email: ${result.message}</div>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<div class="status error">✗ Error: ${error.message}</div>`;
            }
        }
        
        async function testQuoteForm() {
            const statusDiv = document.getElementById('quote-status');
            statusDiv.innerHTML = '<div class="status info">Testing quote request form...</div>';
            
            try {
                // Load SMTP config
                let smtpConfig = null;
                const localConfig = localStorage.getItem('smtp_config');
                if (localConfig) {
                    smtpConfig = JSON.parse(localConfig);
                } else {
                    const configResponse = await fetch('api/get-smtp-config.php');
                    const configData = await configResponse.json();
                    if (configData.success && configData.config) {
                        smtpConfig = configData.config;
                    }
                }
                
                if (!smtpConfig) {
                    statusDiv.innerHTML = '<div class="status error">✗ SMTP not configured. Please configure it in the dashboard first.</div>';
                    return;
                }
                
                const recipientEmail = smtpConfig.recipientEmail || smtpConfig.fromEmail || 'info@ligenpower.com';
                
                const response = await fetch('api/send-email.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        to: recipientEmail,
                        subject: 'Quote Request: Test Product',
                        message: `
                            <h2>New Quote Request</h2>
                            <p><strong>Product:</strong> Test Product</p>
                            <p><strong>Product URL:</strong> ${window.location.href}</p>
                            <hr>
                            <p><strong>Name:</strong> Test User</p>
                            <p><strong>Email:</strong> test@example.com</p>
                            <p><strong>Phone:</strong> +91-1234567890</p>
                            <p><strong>Company:</strong> Test Company</p>
                            <p><strong>Quantity:</strong> 1</p>
                            <p><strong>Message:</strong> This is a test quote request</p>
                            <hr>
                            <p><small>Submitted on: ${new Date().toLocaleString()}</small></p>
                        `,
                        config: smtpConfig
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    statusDiv.innerHTML = `<div class="status success">✓ Quote request test email sent successfully!</div>`;
                } else {
                    statusDiv.innerHTML = `<div class="status error">✗ Failed to send quote request: ${result.message}</div>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<div class="status error">✗ Error: ${error.message}</div>`;
            }
        }
        
        async function checkAPIEndpoints() {
            const statusDiv = document.getElementById('api-status');
            statusDiv.innerHTML = '<div class="status info">Checking API endpoints...</div>';
            
            const endpoints = [
                { name: 'Get SMTP Config', url: 'api/get-smtp-config.php', method: 'GET' },
                { name: 'Send Email', url: 'api/send-email.php', method: 'POST' },
                { name: 'Save SMTP Config', url: 'api/save-smtp-config.php', method: 'POST' }
            ];
            
            for (const endpoint of endpoints) {
                try {
                    const response = await fetch(endpoint.url, {
                        method: endpoint.method,
                        headers: endpoint.method === 'POST' ? { 'Content-Type': 'application/json' } : {}
                    });
                    
                    if (response.ok || response.status === 400 || response.status === 405) {
                        statusDiv.innerHTML += `<div class="status success">✓ ${endpoint.name}: Available (Status: ${response.status})</div>`;
                    } else {
                        statusDiv.innerHTML += `<div class="status error">✗ ${endpoint.name}: Error (Status: ${response.status})</div>`;
                    }
                } catch (error) {
                    statusDiv.innerHTML += `<div class="status error">✗ ${endpoint.name}: ${error.message}</div>`;
                }
            }
        }
    </script>
</body>
</html>

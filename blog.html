    <style>
        :root {
            --primary-green: #4CAF50;
            --primary-green-dark: #45a049;
            --text-dark: #1E293B;
            --text-light: #64748B;
            --white: #FFFFFF;
            --light-bg: #F8FAFC;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --hover-shadow: 0 20px 40px rgba(76, 175, 80, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.7;
            color: var(--text-dark);
            background: var(--white);
        }

        .blog-hero {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--primary-green-dark) 100%);
            color: white;
            padding: 80px 0 60px;
            text-align: center;
        }

        .blog-hero h1 {
            font-family: 'Manrope', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .blog-hero p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .blog-section {
            padding: 80px 0;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .blog-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .blog-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--hover-shadow);
        }

        .blog-card-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: linear-gradient(135deg, #e0e0e0 0%, #f5f5f5 100%);
        }

        .blog-card-content {
            padding: 25px;
        }

        .blog-card-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .blog-card-meta i {
            color: var(--primary-green);
        }

        .blog-card-title {
            font-family: 'Manrope', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-dark);
            line-height: 1.3;
        }

        .blog-card-excerpt {
            color: var(--text-light);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .blog-card-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: gap 0.3s ease;
        }

        .blog-card-link:hover {
            gap: 12px;
        }

        .blog-category {
            display: inline-block;
            background: rgba(76, 175, 80, 0.1);
            color: var(--primary-green);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .blog-loading, .blog-error {
            grid-column: 1 / -1;
            text-align: center;
            padding: 2rem;
            color: var(--text-light);
        }
        .blog-error { color: #c62828; }

        @media (max-width: 768px) {
            .blog-grid {
                grid-template-columns: 1fr;
            }
            .blog-hero h1 {
                font-size: 2rem;
            }
        }

<body>
    <div id="header-placeholder"></div>

    <section class="blog-hero">
        <div class="container">
            <h1>Our Blog</h1>
            <p>Stay updated with the latest insights, innovations, and trends in power management and energy solutions</p>
        </div>
    </section>

    <section class="blog-section">
        <div class="container">
            <div id="blog-grid" class="blog-grid">
                <!-- Posts loaded from API -->
                <div id="blog-loading" class="blog-loading">Loading posts…</div>
                <div id="blog-error" class="blog-error" style="display:none;"></div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="assets/js/blog-urls.js"></script>
    <script>
    // Load blog posts from API
    (async function loadBlogPosts() {
        const grid = document.getElementById('blog-grid');
        const loading = document.getElementById('blog-loading');
        const errorEl = document.getElementById('blog-error');
        try {
            const res = await fetch('api/get-posts.php');
            const data = await res.json();
            if (loading) loading.remove();
            if (!data.success || !Array.isArray(data.posts)) {
                errorEl.style.display = 'block';
                errorEl.textContent = data.message || 'Failed to load posts';
                return;
            }
            const posts = data.posts;
            if (posts.length === 0) {
                grid.insertAdjacentHTML('beforeend', '<p class="blog-loading">No posts yet.</p>');
                return;
            }
            posts.forEach(function(post) {
                const card = document.createElement('div');
                card.className = 'blog-card';
                const url = window.LigenBlogUrls ? window.LigenBlogUrls.postUrl(post) : ('blog?id=' + encodeURIComponent(post.id));
                card.onclick = function() { window.location.href = url; };
                var imgSrc = (post.image && post.image.trim()) ? post.image.trim() : 'assets/images/slide01-min.jpeg';
                if (imgSrc.indexOf('http') !== 0 && imgSrc.indexOf('/') !== 0) imgSrc = '/' + imgSrc;
                card.innerHTML =
                    '<img src="' + imgSrc.replace(/"/g, '&quot;') + '" alt="' + (post.title || '').replace(/"/g, '&quot;') + '" class="blog-card-image" onerror="this.style.display=\'none\'">' +
                    '<div class="blog-card-content">' +
                    '<span class="blog-category">' + (post.category || '').replace(/</g, '&lt;') + '</span>' +
                    '<div class="blog-card-meta">' +
                    '<span><i class="far fa-calendar"></i> ' + (post.date || '').replace(/</g, '&lt;') + '</span>' +
                    '<span><i class="far fa-user"></i> ' + (post.author || 'Admin').replace(/</g, '&lt;') + '</span>' +
                    '</div>' +
                    '<h3 class="blog-card-title">' + (post.title || '').replace(/</g, '&lt;') + '</h3>' +
                    '<p class="blog-card-excerpt">' + (post.excerpt || '').replace(/</g, '&lt;') + '</p>' +
                    '<a href="' + url + '" class="blog-card-link">Read More <i class="fas fa-arrow-right"></i></a>' +
                    '</div>';
                grid.appendChild(card);
            });
        } catch (err) {
            if (loading) loading.remove();
            errorEl.style.display = 'block';
            errorEl.textContent = 'Could not load posts. Please try again.';
            console.error('Blog load error:', err);
        }
    })();

    // Header and footer loaded by header-loader.js
    (function() {
        const s = document.createElement('script');
        s.src = 'assets/js/chatbot.js';
        document.body.appendChild(s);
    })();
    </script>

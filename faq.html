        *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:#17211b;background:#f7faf8}.faq-hero{padding:90px 20px 75px;text-align:center;background:linear-gradient(135deg,#173a24,#45a049);color:#fff}.faq-hero h1{font-size:clamp(36px,5vw,58px);margin:0 0 16px;font-weight:800}.faq-hero p{max-width:720px;margin:auto;font-size:18px;line-height:1.7;opacity:.92}.faq-shell{max-width:1050px;margin:-34px auto 80px;padding:0 20px}.faq-panel{background:#fff;border-radius:20px;padding:28px;box-shadow:0 18px 55px rgba(18,55,30,.12)}.faq-tools{display:grid;grid-template-columns:1fr 240px;gap:14px;margin-bottom:24px}.faq-tools input,.faq-tools select{width:100%;padding:15px 17px;border:1px solid #dce7df;border-radius:12px;font-size:15px;outline:none;background:#fff}.faq-tools input:focus,.faq-tools select:focus{border-color:#4CAF50;box-shadow:0 0 0 4px rgba(76,175,80,.1)}.faq-count{font-size:13px;color:#6b7d70;margin:0 0 16px}.faq-item{border:1px solid #e1ebe4;border-radius:14px;margin-bottom:12px;overflow:hidden;background:#fff;transition:.25s}.faq-item:hover{border-color:#b9d7bf;box-shadow:0 6px 22px rgba(20,70,35,.07)}.faq-question{width:100%;border:0;background:transparent;padding:20px 22px;display:flex;justify-content:space-between;gap:20px;text-align:left;cursor:pointer;color:#17211b;font-size:17px;font-weight:700}.faq-question span:last-child{color:#4CAF50;font-size:22px;transition:.25s}.faq-item.open .faq-question span:last-child{transform:rotate(45deg)}.faq-answer{max-height:0;overflow:hidden;transition:max-height .35s ease}.faq-answer-inner{padding:0 22px 22px;color:#5c6d61;line-height:1.75;white-space:pre-line}.faq-category{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#318243;background:#edf8ef;padding:5px 9px;border-radius:999px;margin-bottom:9px}.faq-empty{text-align:center;padding:55px 20px;color:#718096}.faq-empty i{font-size:38px;color:#a9cbb0;margin-bottom:14px}@media(max-width:700px){.faq-tools{grid-template-columns:1fr}.faq-panel{padding:18px}.faq-hero{padding-top:70px}.faq-shell{margin-top:-25px}}

<body class="home wp-singular page-template-default wp-theme-xstore wp-child-theme-xstore-electronic-mega-market-child theme-xstore et-preloader-off elementor-default elementor-kit-7"><div id="header-placeholder"></div>
<section class="faq-hero"><h1>How can we help?</h1><p>Quick, clear answers about Ligen Power products, technology, warranty and support.</p></section>
<main class="faq-shell"><div class="faq-panel"><div class="faq-tools"><input type="search" id="faq-search" placeholder="Search questions and answers..." aria-label="Search FAQs"><select id="faq-category-filter"><option value="">All Categories</option></select></div><p id="faq-count" class="faq-count">Loading FAQs...</p><div id="faq-list"></div></div></main>
<div id="footer-placeholder"></div>
<script>
let publicFaqs=[];
function renderPublicFaqs(){const query=document.getElementById('faq-search').value.trim().toLowerCase();const category=document.getElementById('faq-category-filter').value;const items=publicFaqs.filter(f=>(!category||f.category===category)&&(!query||(f.question+' '+f.answer+' '+f.category).toLowerCase().includes(query)));document.getElementById('faq-count').textContent=`Showing ${items.length} of ${publicFaqs.length} questions`;const list=document.getElementById('faq-list');if(!items.length){list.innerHTML='<div class="faq-empty"><i class="far fa-circle-question"></i><p>No matching questions found.</p></div>';return;}list.innerHTML='';items.forEach(f=>{const item=document.createElement('article');item.className='faq-item';const button=document.createElement('button');button.className='faq-question';button.type='button';button.setAttribute('aria-expanded','false');const label=document.createElement('span');const badge=document.createElement('small');badge.className='faq-category';badge.textContent=f.category;const text=document.createElement('span');text.textContent=f.question;label.appendChild(badge);label.appendChild(document.createElement('br'));label.appendChild(text);const icon=document.createElement('span');icon.textContent='+';button.appendChild(label);button.appendChild(icon);const answer=document.createElement('div');answer.className='faq-answer';const inner=document.createElement('div');inner.className='faq-answer-inner';inner.textContent=f.answer;answer.appendChild(inner);button.addEventListener('click',()=>{const open=item.classList.toggle('open');button.setAttribute('aria-expanded',open?'true':'false');answer.style.maxHeight=open?answer.scrollHeight+'px':'0';});item.appendChild(button);item.appendChild(answer);list.appendChild(item);});}
fetch('api/manage-faqs.php').then(r=>r.json()).then(data=>{if(!data.success)throw new Error(data.message);publicFaqs=data.faqs||[];const select=document.getElementById('faq-category-filter');[...new Set(publicFaqs.map(f=>f.category))].sort().forEach(c=>{const option=document.createElement('option');option.value=c;option.textContent=c;select.appendChild(option);});renderPublicFaqs();}).catch(()=>{document.getElementById('faq-count').textContent='FAQ service is temporarily unavailable.';});
document.getElementById('faq-search').addEventListener('input',renderPublicFaqs);document.getElementById('faq-category-filter').addEventListener('change',renderPublicFaqs);
</script>

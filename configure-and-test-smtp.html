<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configure & Test SMTP - Ligen Power®</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f6;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1a1a1a;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e5e5;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76,175,80,0.1);
        }
        button {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76,175,80,0.3);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: 600;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 Configure & Test SMTP</h1>
        
        <form id="smtp-form">
            <div class="form-group">
                <label>SMTP Host *</label>
                <input type="text" id="smtp-host" value="smtp.hostinger.com" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>SMTP Port *</label>
                    <input type="number" id="smtp-port" value="465" required>
                </div>
                <div class="form-group">
                    <label>Encryption *</label>
                    <select id="smtp-encryption" required>
                        <option value="ssl" selected>SSL</option>
                        <option value="tls">TLS</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label>SMTP Username (Email) *</label>
                <input type="email" id="smtp-username" value="info@clasmentor.in" required>
            </div>
            
            <div class="form-group">
                <label>SMTP Password *</label>
                <input type="password" id="smtp-password" required>
            </div>
            
            <div class="form-group">
                <label>From Email *</label>
                <input type="email" id="smtp-from-email" value="info@clasmentor.in" required>
            </div>
            
            <div class="form-group">
                <label>From Name</label>
                <input type="text" id="smtp-from-name" value="Ligen Power®">
            </div>
            
            <button type="button" onclick="saveAndTestSMTP()">Save Configuration & Send Test Email</button>
        </form>
        
        <div id="status-message"></div>
    </div>

    <script>
        async function saveAndTestSMTP() {
            const statusDiv = document.getElementById('status-message');
            statusDiv.innerHTML = '<div class="status info">Saving SMTP configuration...</div>';
            
            // Get form values
            const config = {
                host: document.getElementById('smtp-host').value,
                port: parseInt(document.getElementById('smtp-port').value),
                username: document.getElementById('smtp-username').value,
                password: document.getElementById('smtp-password').value,
                fromEmail: document.getElementById('smtp-from-email').value,
                fromName: document.getElementById('smtp-from-name').value || 'Ligen Power®',
                encryption: document.getElementById('smtp-encryption').value
            };
            
            try {
                // Save SMTP config
                const saveResponse = await fetch('api/save-smtp-config.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(config)
                });
                
                const saveResult = await saveResponse.json();
                
                if (!saveResult.success) {
                    statusDiv.innerHTML = `<div class="status error">✗ Failed to save SMTP config: ${saveResult.message}</div>`;
                    return;
                }
                
                statusDiv.innerHTML += '<div class="status success">✓ SMTP configuration saved successfully!</div>';
                statusDiv.innerHTML += '<div class="status info">Sending test email to doprudra@gmail.com...</div>';
                
                // Also save to localStorage for immediate use
                localStorage.setItem('smtp_config', JSON.stringify(config));
                
                // Send test email
                const testEmailResponse = await fetch('api/send-email.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        to: 'doprudra@gmail.com',
                        subject: 'Test Email from Ligen Power® - SMTP Configuration',
                        message: `
                            <h2>✅ SMTP Configuration Test</h2>
                            <p>This is a test email sent from the Ligen Power® website.</p>
                            <hr>
                            <p><strong>SMTP Host:</strong> ${config.host}</p>
                            <p><strong>SMTP Port:</strong> ${config.port}</p>
                            <p><strong>Encryption:</strong> ${config.encryption.toUpperCase()}</p>
                            <p><strong>From Email:</strong> ${config.fromEmail}</p>
                            <p><strong>From Name:</strong> ${config.fromName}</p>
                            <hr>
                            <p><strong>Time Sent:</strong> ${new Date().toLocaleString()}</p>
                            <p><small>If you received this email, the SMTP configuration is working correctly! 🎉</small></p>
                        `,
                        config: config
                    })
                });
                
                const testResult = await testEmailResponse.json();
                
                if (testResult.success) {
                    statusDiv.innerHTML += `<div class="status success">✓ Test email sent successfully to doprudra@gmail.com!</div>`;
                    statusDiv.innerHTML += `<div class="status info">Please check the inbox (and spam folder) for the test email.</div>`;
                } else {
                    statusDiv.innerHTML += `<div class="status error">✗ Failed to send test email: ${testResult.message}</div>`;
                    statusDiv.innerHTML += `<div class="status info">SMTP configuration was saved, but email sending failed. Please check the error message above.</div>`;
                }
                
            } catch (error) {
                statusDiv.innerHTML += `<div class="status error">✗ Error: ${error.message}</div>`;
                console.error('Error:', error);
            }
        }
        
        // Load existing config on page load
        window.addEventListener('DOMContentLoaded', async function() {
            try {
                const response = await fetch('api/get-smtp-config.php');
                const data = await response.json();
                
                if (data.success && data.config) {
                    const config = data.config;
                    document.getElementById('smtp-host').value = config.host || 'smtp.hostinger.com';
                    document.getElementById('smtp-port').value = config.port || '465';
                    document.getElementById('smtp-encryption').value = config.encryption || 'ssl';
                    document.getElementById('smtp-username').value = config.username || 'info@clasmentor.in';
                    document.getElementById('smtp-password').value = config.password || '';
                    document.getElementById('smtp-from-email').value = config.fromEmail || 'info@clasmentor.in';
                    document.getElementById('smtp-from-name').value = config.fromName || 'Ligen Power®';
                }
            } catch (error) {
                console.log('No existing config found, using defaults');
            }
        });
    </script>
</body>
</html>

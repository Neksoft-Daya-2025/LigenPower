<!DOCTYPE html>
<html lang="en-US">
<head>
	<meta charset="UTF-8" />
	<link rel="icon" type="image/png" href="assets/images/Ligen-Registered-logo.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
	<title>Order Success | Ligen Power®</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
			background: linear-gradient(135deg, #f5f5f6 0%, #ffffff 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}
		.success-container {
			background: #ffffff;
			border-radius: 16px;
			padding: 50px;
			max-width: 600px;
			width: 100%;
			box-shadow: 0 8px 30px rgba(0,0,0,0.1);
			text-align: center;
		}
		.success-icon {
			width: 100px;
			height: 100px;
			background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0 auto 30px;
			animation: scaleIn 0.5s ease-out;
		}
		.success-icon i {
			font-size: 50px;
			color: #ffffff;
		}
		@keyframes scaleIn {
			from {
				transform: scale(0);
			}
			to {
				transform: scale(1);
			}
		}
		.success-title {
			font-size: 32px;
			font-weight: 800;
			color: #000;
			margin-bottom: 15px;
		}
		.success-message {
			font-size: 16px;
			color: #666;
			margin-bottom: 30px;
			line-height: 1.6;
		}
		.order-details {
			background: #f8f9fa;
			border-radius: 12px;
			padding: 25px;
			margin-bottom: 30px;
			text-align: left;
		}
		.order-details h3 {
			font-size: 18px;
			font-weight: 700;
			color: #000;
			margin-bottom: 15px;
		}
		.order-row {
			display: flex;
			justify-content: space-between;
			padding: 10px 0;
			border-bottom: 1px solid #e5e5e5;
		}
		.order-row:last-child {
			border-bottom: none;
		}
		.order-row strong {
			color: #333;
		}
		.order-row span {
			color: #666;
		}
		.btn-group {
			display: flex;
			gap: 15px;
			justify-content: center;
			flex-wrap: wrap;
		}
		.btn {
			display: inline-block;
			padding: 14px 30px;
			border-radius: 8px;
			font-size: 16px;
			font-weight: 600;
			text-decoration: none;
			transition: all 0.3s ease;
		}
		.btn-primary {
			background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
			color: #ffffff;
			box-shadow: 0 4px 12px rgba(76,175,80,0.3);
		}
		.btn-primary:hover {
			transform: translateY(-2px);
			box-shadow: 0 6px 20px rgba(76,175,80,0.4);
		}
		.btn-secondary {
			background: #f0f0f0;
			color: #333;
		}
		.btn-secondary:hover {
			background: #e0e0e0;
		}
	</style>
</head>
<body>
	<div class="success-container">
		<div class="success-icon">
			<i class="fas fa-check"></i>
		</div>
		<h1 class="success-title">Order Placed Successfully!</h1>
		<p class="success-message">
			Thank you for your purchase. Your order has been confirmed and we'll send you an email with the order details shortly.
		</p>
		<div class="order-details" id="order-details">
			<h3>Order Details</h3>
			<div class="order-row">
				<strong>Order ID:</strong>
				<span id="order-id">-</span>
			</div>
			<div class="order-row">
				<strong>Product:</strong>
				<span id="product-name">-</span>
			</div>
			<div class="order-row">
				<strong>Amount:</strong>
				<span id="order-amount">-</span>
			</div>
			<div class="order-row">
				<strong>Payment Status:</strong>
				<span style="color: #4CAF50; font-weight: 600;">Completed</span>
			</div>
		</div>
		<div class="btn-group">
			<a href="/" class="btn btn-primary">Continue Shopping</a>
			<a href="dashboard" class="btn btn-secondary">View Dashboard</a>
		</div>
	</div>

	<script>
		// Get order ID from URL
		const urlParams = new URLSearchParams(window.location.search);
		const orderId = urlParams.get('orderId');

		if (orderId) {
			// Load order from localStorage
			const orders = JSON.parse(localStorage.getItem('orders') || '[]');
			const order = orders.find(o => o.id === orderId);

			if (order) {
				document.getElementById('order-id').textContent = order.id;
				document.getElementById('product-name').textContent = order.productName;
				document.getElementById('order-amount').textContent = '₹' + order.amount.toLocaleString();
			} else {
				document.getElementById('order-id').textContent = orderId;
			}
		}
	</script>
	<script src="assets/js/disable-context-menu.js"></script>
</body>
</html>
